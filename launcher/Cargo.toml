[package]
name = "georgikon-launcher"
version = "0.1.0"
edition = "2024"
description = "Launcher for the Georgikon MMORPG"
license = "GPL-3.0"
rust-version = "1.85"

[dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "wayland",
    "x11",
    "glow",
] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
